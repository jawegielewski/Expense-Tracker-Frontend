<div class="card my-5">
  <div class="card-body">
    <table class="table table-bordered table-striped">
      <thead class="thead-dark">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Name</th>
        <th scope="col">Price</th>
        <th scope="col">Date</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let expense of expenses">
        <td>{{ expense.id }}</td>
        <td>{{ expense.name }}</td>
        <td>{{ expense.price }}</td>
        <td>{{ expense.dateMillis | date:'mediumDate':'UTC' }}</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
